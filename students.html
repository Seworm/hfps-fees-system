<!-- This content will be loaded dynamically into content-area -->
<div id="students" class="page">
    <h2 class="page-title">
        <i class="fas fa-users"></i> Student Management
    </h2>
    
    <div class="page-controls">
        <button class="btn btn-primary" onclick="showAddStudentForm()">
            <i class="fas fa-user-plus"></i> Add New Student
        </button>
        <div class="search-box">
            <input type="text" id="searchStudents" placeholder="Search students by name or ID...">
            <i class="fas fa-search"></i>
        </div>
        <select id="classFilter" onchange="loadStudents()">
            <option value="all">All Classes</option>
            <option value="Crèche">Crèche</option>
            <option value="Nursery 1">Nursery 1</option>
            <option value="Nursery 2">Nursery 2</option>
            <option value="Kindergarten 1">Kindergarten 1</option>
            <option value="Kindergarten 2">Kindergarten 2</option>
            <option value="Basic 1">Basic 1</option>
            <option value="Basic 2">Basic 2</option>
            <option value="Basic 3">Basic 3</option>
            <option value="Basic 4">Basic 4</option>
            <option value="Basic 5">Basic 5</option>
            <option value="Basic 6">Basic 6</option>
            <option value="JHS 1">JHS 1</option>
            <option value="JHS 2">JHS 2</option>
            <option value="JHS 3">JHS 3</option>
        </select>
    </div>
    
    <!-- Add Student Form (Hidden by default) -->
    <div id="addStudentForm" class="form-container" style="display: none;">
        <h3><i class="fas fa-user-plus"></i> Add New Student</h3>
        <form id="studentForm" onsubmit="saveStudent(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="studentClass">Class *</label>
                    <select id="studentClass" required>
                        <option value="">Select Class</option>
                        <option value="Crèche">Crèche</option>
                        <option value="Nursery 1">Nursery 1</option>
                        <option value="Nursery 2">Nursery 2</option>
                        <option value="Kindergarten 1">Kindergarten 1</option>
                        <option value="Kindergarten 2">Kindergarten 2</option>
                        <option value="Basic 1">Basic 1</option>
                        <option value="Basic 2">Basic 2</option>
                        <option value="Basic 3">Basic 3</option>
                        <option value="Basic 4">Basic 4</option>
                        <option value="Basic 5">Basic 5</option>
                        <option value="Basic 6">Basic 6</option>
                        <option value="JHS 1">JHS 1</option>
                        <option value="JHS 2">JHS 2</option>
                        <option value="JHS 3">JHS 3</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="academicTerm">Academic Term *</label>
                    <select id="academicTerm" required>
                        <option value="">Select Term</option>
                        <option value="Term 1">Term 1</option>
                        <option value="Term 2">Term 2</option>
                        <option value="Term 3">Term 3</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="academicYear">Academic Year *</label>
                    <select id="academicYear" required>
                        <option value="">Select Year</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Save Student
                </button>
                <button type="button" class="btn btn-secondary" onclick="hideAddStudentForm()">
                    <i class="fas fa-times"></i> Cancel
                </button>
            </div>
        </form>
    </div>
    
    <!-- Students Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Full Name</th>
                    <th>Gender</th>
                    <th>Class</th>
                    <th>Term</th>
                    <th>Year</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsTable">
                <tr>
                    <td colspan="7">Loading students...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
